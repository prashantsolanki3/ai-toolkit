name: Release

# Trigger: push a tag matching v* (e.g. v1.0.0)
# To release: git tag v1.0.0 && git push origin v1.0.0
# The workflow runs release-check (lint + tests + scan + verify-tools + verify-manifest + e2e + pack-check)
# and then publishes to npm if all gates pass.
on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'

permissions:
  contents: read
  id-token: write  # required for npm provenance

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: make lint

      - name: Test
        run: make test

      - name: Verify tools config
        run: make verify-tools

      - name: Verify manifest
        run: make verify-manifest

      - name: Pack check (publish readiness)
        run: make pack-check

      - name: E2E
        run: make e2e

      - name: Publish to npm
        run: npm publish --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
