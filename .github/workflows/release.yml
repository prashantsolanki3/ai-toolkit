name: Release

# Trigger: push a tag matching v* (e.g. v1.0.0)
# To release: git tag v1.0.0 && git push origin v1.0.0
# Mirrors the local `make release-check` gates as discrete steps
# (lint, scan, test, verify-tools, verify-manifest, e2e — the
# publish-readiness/pack assertions run as part of `make test`), then
# publishes to npm if every gate passes.
on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'

permissions:
  contents: read
  id-token: write  # required for npm provenance

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Install gitleaks
        run: |
          GITLEAKS_VERSION=8.18.4
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: make lint

      - name: Secret scan
        run: make scan

      - name: Test
        run: make test

      - name: Verify tools config
        run: make verify-tools

      - name: Verify manifest
        run: make verify-manifest

      - name: E2E
        run: make e2e

      - name: Publish to npm
        run: npm publish --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
